# Aetheris Shaders - pack level configuration.
#
# Deliberately minimal, and it stays that way until the pack is confirmed to load.
#
# This file used to carry `screen`, `sliders`, `profile.*` and a `#if` block. Every one of
# those makes Iris look an option name up in the set it discovered from the shader sources,
# and a name that does not resolve aborts the load — with an exception whose message is
# empty, which is what an empty error pane actually is ("No value present"). None of it is
# needed for the pack to render, so none of it is here. The tunables still live in
# shaders/lib/settings.glsl as compile time defaults.
#
# What is left is only the vanilla rendering the pack replaces in shader code. Together
# these save submitting the cloud, sun, moon and star geometry at all rather than drawing it
# and discarding it, and they keep the vanilla vignette and underwater overlay from being
# laid over this pack's own grade and underwater fog.

clouds = off
sun = false
moon = false
stars = false
vignette = false
underwaterOverlay = false
