# Aetheris Shaders - pack level configuration.
#
# The options themselves live in shaders/lib/settings.glsl. This file only says how
# the Shader Pack Settings screen is laid out, which options are sliders, what the
# shipped presets set, and how vanilla's own rendering is to be suppressed so the
# pack can replace it.
#
# Every value is on a single line on purpose. Line continuation with a trailing
# backslash is a java.util.Properties feature, not something shaders.properties is
# documented to support, and a truncated preset is a silent, confusing failure.
#
# Layout tokens: OPTION, [SUBSCREEN], <profile>, <empty>, *

screen = <empty> <profile> [SCENE] [WATER] [QUALITY] [COLOUR] *

# ---------------------------------------------------------------------------
# Suppressing what the pack draws itself
# ---------------------------------------------------------------------------

# The cloud deck is procedural, in composite. Turning vanilla's squashed boxes off
# saves the vertex work entirely rather than drawing them and discarding.
clouds = off

# Sun, moon and stars are drawn procedurally in composite, tinted by the same
# atmosphere model that decides the colour of the sunlight. Vanilla's are not just
# hidden, they are never submitted.
sun = false
moon = false
stars = false

# Vanilla's screen edge vignette and its flat blue underwater overlay both fight the
# pack's own colour grading and its underwater fog. The vignette is replaced by a
# controlled one in final.
vignette = false
underwaterOverlay = false

# Smooth lighting for the held item, so the hand is lit by the same model as the
# world instead of by the fixed function lightmap.
oldLighting = false

# ---------------------------------------------------------------------------
# Shadow pass
# ---------------------------------------------------------------------------

# Iris evaluates these after shader option preprocessing, so this really removes the
# shadow render pass rather than leaving it running and not sampling it. On this GPU
# that is roughly a third of the vertex work.
#if SHADOWS == 1
shadow.enabled = true
#else
shadow.enabled = false
#endif

# Water and translucent geometry do not cast shadows: a lake should not darken its own
# bed, and shadowing through glass is not worth a second submission.
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
shadowTranslucent = false
shadowEntitiesTranslucent = false

# ---------------------------------------------------------------------------
# Blending
# ---------------------------------------------------------------------------

# Made explicit rather than left to the default. The water program's whole colour
# strategy depends on alpha zero meaning "contribute nothing", and its data target
# depends on alpha one meaning "overwrite" and alpha zero meaning "leave alone". Both
# of those only hold under the standard source alpha function.
blend.gbuffers_water = srcalpha oneminussrcalpha
blend.gbuffers_weather = srcalpha oneminussrcalpha
blend.gbuffers_damagedblock = srcalpha oneminussrcalpha
blend.gbuffers_textured_lit = srcalpha oneminussrcalpha

# Additive, because that is what these effects are.
blend.gbuffers_armor_glint = srcalpha one
blend.gbuffers_beaconbeam = srcalpha one
blend.gbuffers_lightning = srcalpha one
blend.gbuffers_entities_glowing = srcalpha one

# ---------------------------------------------------------------------------
# Screens
# ---------------------------------------------------------------------------

screen.SCENE = SUN_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH FOG_DENSITY FOG_HEIGHT CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_SCALE CLOUD_SPEED
screen.WATER = WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_CLARITY WATER_REFRACTION WATER_REFLECTIONS REFLECTION_STEPS
screen.QUALITY = SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS SSAO SSAO_SAMPLES CLOUDS CLOUD_STEPS CLOUD_DETAIL CLOUD_CIRRUS VEGETATION_WIND WATER_WAVES ANTI_ALIASING
screen.COLOUR = COLOR_EXPOSURE COLOR_TEMPERATURE COLOR_SATURATION COLOR_CONTRAST COLOR_VIGNETTE

# Only the free valued options. Anything with a fixed list in settings.glsl is a cycle
# and does not want a slider.
sliders = SUN_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH FOG_DENSITY FOG_HEIGHT CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_SCALE CLOUD_SPEED WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_CLARITY WATER_REFRACTION SHADOW_SOFTNESS COLOR_EXPOSURE COLOR_TEMPERATURE COLOR_SATURATION COLOR_CONTRAST COLOR_VIGNETTE

# ---------------------------------------------------------------------------
# Presets
# ---------------------------------------------------------------------------

# DEFAULT is what the pack is designed against. It is the set of settings meant to
# hold a playable frame rate at 1280x720 on an HD 5500 while still being recognisably
# Aetheris: shadows, water reflections, ambient occlusion, FXAA and the cloud march
# all stay, because they are the identity of the pack. What it does not keep is the
# top end of any of them.
profile.DEFAULT = SHADOWS=1 shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=6 SHADOW_SOFTNESS=1.0 SSAO=1 SSAO_SAMPLES=6 WATER_REFLECTIONS=1 REFLECTION_STEPS=8 CLOUDS=1 CLOUD_STEPS=8 CLOUD_DETAIL=1 CLOUD_CIRRUS=1 VEGETATION_WIND=1 WATER_WAVES=1 ANTI_ALIASING=1

# PERFORMANCE drops the things that cost a whole extra pass or loop rather than quietly
# decimating everything. The identity survives: the blue hour, the water body colour,
# the wave normals, the sun disc and the tone curve all stay. What goes is the shadow
# pass (about a third of the vertex work), ambient occlusion, screen space reflections,
# FXAA, and the fine cloud octaves.
profile.PERFORMANCE = SHADOWS=0 shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SAMPLES=4 SHADOW_SOFTNESS=0.8 SSAO=0 SSAO_SAMPLES=4 WATER_REFLECTIONS=0 REFLECTION_STEPS=6 CLOUDS=1 CLOUD_STEPS=5 CLOUD_DETAIL=0 CLOUD_CIRRUS=0 VEGETATION_WIND=1 WATER_WAVES=1 ANTI_ALIASING=0

# VISUAL spends everything the hardware has. Not intended for 1080p: at 1024x600, or
# with the render distance pulled in, it is how the pack is meant to look.
profile.VISUAL = SHADOWS=1 shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=9 SHADOW_SOFTNESS=1.25 SSAO=1 SSAO_SAMPLES=9 WATER_REFLECTIONS=1 REFLECTION_STEPS=10 CLOUDS=1 CLOUD_STEPS=12 CLOUD_DETAIL=1 CLOUD_CIRRUS=1 VEGETATION_WIND=1 WATER_WAVES=1 ANTI_ALIASING=1
