# Aetheris Shaders - block ID map.
#
# Iris reads this file and exposes the numeric ID of each listed block to the
# shaders as mc_Entity.x. The IDs themselves are arbitrary; what matters is that
# they agree with the AETHERIS_ID_* constants at the top of shaders/lib/vegetation.glsl.
# There is deliberately some space between the groups so more blocks can be added
# without renumbering.
#
# If this file is ever missing or unreadable, every block reports ID 0 and the pack
# keeps working: vegetation falls back to plain terrain shading and wind stops.
# That is a graceful degradation by design, not an accident.
#
# Unknown block names are ignored by Iris, so names that only exist in some versions
# can be listed side by side without breaking anything.

# ---------------------------------------------------------------------------
# 10000 - leaves
# ---------------------------------------------------------------------------
block.10000=minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves \
            minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves \
            minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves \
            minecraft:flowering_azalea_leaves minecraft:pale_oak_leaves

# ---------------------------------------------------------------------------
# 10100 - plants, grass and crops
#
# Everything here gets the translucent leaf treatment and a height weighted wind
# sway. Tall flat geometry that is not rooted in the ground is deliberately left
# out: lily pads sit on the water surface and vines hang from whatever they are
# attached to, so swaying them by a plant's height curve looks wrong.
# ---------------------------------------------------------------------------
block.10100=minecraft:short_grass minecraft:grass minecraft:tall_grass \
            minecraft:fern minecraft:large_fern \
            minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium \
            minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip \
            minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy \
            minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose \
            minecraft:torchflower minecraft:pink_petals minecraft:wildflowers \
            minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony \
            minecraft:oak_sapling minecraft:spruce_sapling minecraft:birch_sapling \
            minecraft:jungle_sapling minecraft:acacia_sapling minecraft:dark_oak_sapling \
            minecraft:cherry_sapling minecraft:mangrove_propagule minecraft:azalea \
            minecraft:flowering_azalea minecraft:bush minecraft:firefly_bush \
            minecraft:short_dry_grass minecraft:tall_dry_grass minecraft:cactus_flower \
            minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots \
            minecraft:nether_wart minecraft:sweet_berry_bush minecraft:torchflower_crop \
            minecraft:pitcher_plant minecraft:sugar_cane minecraft:kelp \
            minecraft:kelp_plant minecraft:seagrass minecraft:tall_seagrass

# ---------------------------------------------------------------------------
# 10200 - water
#
# The one ID the whole water pipeline depends on. A block here writes no colour and
# instead flags its pixel as a water surface for composite to shade.
# ---------------------------------------------------------------------------
block.10200=minecraft:water

# ---------------------------------------------------------------------------
# 10300 - luminous blocks
#
# Not for shadows or emission colour, which block light already handles. This is for
# the extra self illumination that stops lava and glowstone reading flat, and for
# the emissive path in the lighting model.
# ---------------------------------------------------------------------------
block.10300=minecraft:lava minecraft:glowstone minecraft:shroomlight \
            minecraft:sea_lantern minecraft:jack_o_lantern minecraft:magma_block \
            minecraft:campfire minecraft:soul_campfire minecraft:fire \
            minecraft:soul_fire minecraft:torch minecraft:wall_torch \
            minecraft:soul_torch minecraft:soul_wall_torch \
            minecraft:lantern minecraft:soul_lantern minecraft:redstone_lamp \
            minecraft:beacon minecraft:crying_obsidian minecraft:ochre_froglight \
            minecraft:verdant_froglight minecraft:pearlescent_froglight
