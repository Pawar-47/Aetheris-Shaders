# Aetheris Shaders - pack level configuration.
#
# The options themselves live in lib/settings.glsl. This file says how the Shader Pack
# Settings screen is laid out, which options are sliders, what the shipped presets set, and
# which parts of vanilla rendering the pack replaces.
#
# Layout tokens: OPTION, [SUBSCREEN], <profile>, <empty>, *
#
# One rule that cost several releases: every name in screen.*, sliders and profile.* must be
# an option Iris has actually registered, and Iris registers a `const` option only for a
# fixed list of its own names. Every user option in this pack is therefore a #define. A name
# that does not resolve aborts the load while the pack is applied, and that error carries no
# message, which is why it shows up as an empty details pane.

screen = <empty> <profile> [SCENE] [WATER] [QUALITY] [COLOUR] *
screen.columns = 3

# Iris evaluates these after shader-option preprocessing, so this really removes the shadow
# render pass rather than leaving it running and unsampled. On this GPU that is roughly a
# third of the vertex work.
#if SHADOWS == 0
shadow.enabled = false
#else
shadow.enabled = true
#endif

# The cloud deck, sun, moon and stars are drawn procedurally in composite, so vanilla's are
# never submitted. The vignette and the flat blue underwater overlay would be laid over this
# pack's own grade and underwater fog, so both are off.
clouds = off
sun = false
moon = false
stars = false
vignette = false
underwaterOverlay = false

screen.SCENE = SUN_STRENGTH SUN_SIZE AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH FOG_DENSITY FOG_START FOG_HEIGHT CLOUD_COVERAGE CLOUD_SOFTNESS CLOUD_ALTITUDE CLOUD_SCALE CLOUD_SPEED
screen.WATER = WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_CLARITY WATER_REFRACTION WATER_RED WATER_GREEN WATER_BLUE WATER_REFLECTIONS REFLECTION_STEPS UNDERWATER_TINT
screen.QUALITY = SHADOWS SHADOW_SAMPLES shadowMapResolution shadowDistance SHADOW_SOFTNESS SSAO SSAO_SAMPLES CLOUDS CLOUD_STEPS CLOUD_DETAIL CLOUD_CIRRUS VEGETATION_WIND WATER_WAVES ANTI_ALIASING
screen.COLOUR = COLOR_EXPOSURE COLOR_TEMPERATURE COLOR_SATURATION COLOR_CONTRAST COLOR_VIGNETTE

# Only the free valued options. Anything with a fixed list in settings.glsl is a cycle and
# does not want a slider.
sliders = SUN_STRENGTH SUN_SIZE AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH FOG_DENSITY FOG_START FOG_HEIGHT CLOUD_COVERAGE CLOUD_SOFTNESS CLOUD_ALTITUDE CLOUD_SCALE CLOUD_SPEED WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_CLARITY WATER_REFRACTION WATER_RED WATER_GREEN WATER_BLUE UNDERWATER_TINT SHADOW_SOFTNESS COLOR_EXPOSURE COLOR_TEMPERATURE COLOR_SATURATION COLOR_CONTRAST COLOR_VIGNETTE

# DEFAULT is what the pack is designed against: shadows, water reflections, ambient
# occlusion, FXAA and the cloud march all stay, because they are the identity of the pack.
profile.DEFAULT = SHADOWS=1 shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=6 SHADOW_SOFTNESS=1.0 SSAO=1 SSAO_SAMPLES=6 WATER_REFLECTIONS=1 REFLECTION_STEPS=8 CLOUDS=1 CLOUD_STEPS=8 CLOUD_DETAIL=1 CLOUD_CIRRUS=1 VEGETATION_WIND=1 WATER_WAVES=1 ANTI_ALIASING=1

# PERFORMANCE drops what costs a whole extra pass: the shadow pass, ambient occlusion, the
# reflection march and FXAA. The identity survives: the atmosphere, the water body colour,
# the wave normals, the sun disc and the tone curve all stay.
profile.PERFORMANCE = SHADOWS=0 shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SAMPLES=4 SHADOW_SOFTNESS=0.8 SSAO=0 SSAO_SAMPLES=4 WATER_REFLECTIONS=0 REFLECTION_STEPS=6 CLOUDS=1 CLOUD_STEPS=5 CLOUD_DETAIL=0 CLOUD_CIRRUS=0 VEGETATION_WIND=1 WATER_WAVES=1 ANTI_ALIASING=0

# VISUAL spends everything the hardware has. Not intended for 1080p.
profile.VISUAL = SHADOWS=1 shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=9 SHADOW_SOFTNESS=1.25 SSAO=1 SSAO_SAMPLES=9 WATER_REFLECTIONS=1 REFLECTION_STEPS=10 CLOUDS=1 CLOUD_STEPS=12 CLOUD_DETAIL=1 CLOUD_CIRRUS=1 VEGETATION_WIND=1 WATER_WAVES=1 ANTI_ALIASING=1
